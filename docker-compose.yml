name: autolp

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://autolp:${POSTGRES_PASSWORD:-autolp}@db:5432/autolp_${APP_ENV:-dev}
    APP_ENV: ${APP_ENV:-dev}
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: autolp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autolp}
      POSTGRES_DB: autolp_${APP_ENV:-dev}
      TZ: UTC
      PGTZ: UTC
      TS_TUNE_MEMORY: 1GB
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autolp -d autolp_${APP_ENV:-dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "autolp.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    <<: *backend
    command: ["python", "-m", "autolp.collector.main"]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
